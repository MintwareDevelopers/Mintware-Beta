name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo. Overrides the org/repo default GITHUB_TOKEN grant.
permissions:
  contents: read

jobs:
  context-drift:
    name: Context drift (AUTO blocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No install needed — the generator uses only Node builtins.
      - name: Check .claude AUTO blocks are in sync with code
        run: node scripts/context-sync.mjs --check

  branch-drift:
    name: Branch drift (which branch is real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history — behind/ahead vs origin/main needs it
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Always surface the full drift picture in the logs (informational; never fails).
      - name: Report branch drift vs main
        run: node scripts/branch-drift.mjs
      # Fails if THIS branch is egregiously behind main → you may be planning/merging off a stale base.
      - name: Fail if the branch is far behind main
        run: node scripts/branch-drift.mjs --check

  js-tests:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm test

  forge-tests:
    name: Foundry
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # LP-gateway fork suites (test/fork/MintwareLpGateway*, test/audit/RedTeamOnchainFork, HackenContracts) fork
      # Robinhood Chain TESTNET (46630) — a PUBLIC RPC, no secret. Locally they self-skip when this is unset; in CI
      # it is set so the real-V4 proofs (H-02/H-03, F-01/F-02, RT-*, C-10, recipient rotation) actually run.
      LP_FORK_RPC_URL: https://rpc.testnet.chain.robinhood.com
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pin to a specific KNOWN-GOOD version, not the action's default (nightly) or a moving `stable`
          # (which silently advanced 1.5.1 → 1.8.0 and broke CI once). Bump this deliberately + re-verify.
          # The two setUp()s that forge 1.8 exposed (vm.prank strictness + CREATE-nonce accounting across
          # calls) are now fixed in this repo, so the full non-fork suite is green on 1.8.0.
          version: "1.8.0"

      # The whole suite WITHOUT the fork env — exactly what a contributor gets locally (fork harnesses
      # self-skip). This is the step that must stay green regardless of any third-party RPC.
      - name: Forge tests (non-fork, full suite)
        env:
          LP_FORK_RPC_URL: ""
        run: forge test -vv

      # Preflight the public RPC so an outage reports as ONE clear line, not 50 opaque fork errors.
      - name: Check Robinhood testnet RPC is reachable
        run: |
          for i in 1 2 3 4 5; do
            if curl -sS --max-time 15 -X POST "$LP_FORK_RPC_URL" \
                 -H 'content-type: application/json' \
                 -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' | grep -q '"result"'; then
              echo "RPC reachable: $LP_FORK_RPC_URL"; exit 0
            fi
            echo "attempt $i: RPC not answering, retrying in $((i*10))s…"; sleep $((i*10))
          done
          echo "::error title=Robinhood testnet RPC down::$LP_FORK_RPC_URL did not answer eth_chainId after 5 attempts — the LP-gateway fork suites cannot run. Re-run the job once the public RPC is back (nothing in the repo is at fault)."
          exit 1

      # The LP-gateway fork suites against the REAL Uniswap V4 stack, retried in a 3-attempt outer loop so a
      # flaky public RPC doesn't fail the job (forge's own `--fork-retries` only applies with `--rpc-url`,
      # which would fork EVERY test — these harnesses `vm.createSelectFork` themselves). A GENUINE test
      # failure still fails the job (continue-on-error is deliberately NOT set). `MintwareLpGatewayForkTest`
      # (the operator-runbook harness) is excluded on purpose: it needs the live rig's `LP_QUOTE_ASSET` etc.
      - name: Forge tests (LP-gateway fork suites, Robinhood testnet)
        run: |
          set +e
          for attempt in 1 2 3; do
            forge test -vv \
              --match-contract 'MintwareLpGateway(Hardening|AuditRound2|Closeout)Fork|RedTeamOnchainFork|HackenLpGateway'
            rc=$?
            [ $rc -eq 0 ] && exit 0
            echo "::warning::fork suites exit=$rc on attempt $attempt/3 — retrying in $((attempt*20))s (public RPC flake?)"
            sleep $((attempt*20))
          done
          echo "::error title=LP-gateway fork suites failed::3 attempts against $LP_FORK_RPC_URL failed. If the log shows RPC/transport errors the public RPC is degraded — re-run; if it shows [FAIL] assertions, it's a real regression."
          exit 1

  rust-tests:
    name: Rust (YPN off-chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ubuntu-latest's preinstalled Rust (currently 1.94) ships WITHOUT the clippy component, so
      # `cargo clippy` fails with "'cargo-clippy' is not installed for the toolchain '1.94'".
      # dtolnay/rust-toolchain@stable did NOT reliably add clippy to that pre-existing toolchain
      # (the install step passed but `cargo clippy` still couldn't find it), so add the component
      # explicitly to the active default toolchain — this always resolves for a stable release.
      - name: Add clippy component
        run: rustup component add clippy

      # The edge-auth + relayer crates are detached workspaces, so test each in its own dir.
      # Live-network tests (EDGE_RPC_URL / RELAYER_RPC_URL) self-skip when the env is unset.
      - name: edge-auth — test + clippy
        working-directory: services/edge-auth
        run: |
          cargo test --locked
          cargo clippy --all-targets -- -D warnings

      - name: relayer — test + clippy
        working-directory: services/relayer
        run: |
          cargo test --locked
          cargo clippy --all-targets -- -D warnings

  coq-proofs:
    name: Formal proofs (Coq, mulDiv lemmas)
    runs-on: ubuntu-latest
    # A REAL gate (not advisory): the 4 nonlinear mulDiv lemmas that SMT solvers can't decide
    # (div-by-symbolic). Coq's nia proves them as decidable, machine-checked theorems — so `coqc`
    # exiting 0 IS the proof. (The advisory Halmos job was removed with its MWFormalProofs target in
    # the 2026-10 simplification; history: docs/archive/retired-mechanics/.)
    steps:
      - uses: actions/checkout@v7
      - name: Install Coq
        run: |
          sudo apt-get update
          sudo apt-get install -y coq
          coqc --version
      - name: Compile the mulDiv lemma proofs (coqc = verification)
        run: coqc contracts-v4/proofs/coq/MulDivLemmas.v

  security-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Advisory for now (continue-on-error) so a pre-existing transitive advisory doesn't
      # block every merge. Remove `continue-on-error` to make high/critical a hard gate.
      - name: pnpm audit (high+, prod deps)
        continue-on-error: true
        run: pnpm audit --audit-level=high --prod
