name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo. Overrides the org/repo default GITHUB_TOKEN grant.
permissions:
  contents: read

jobs:
  context-drift:
    name: Context drift (AUTO blocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No install needed — the generator uses only Node builtins.
      - name: Check .claude AUTO blocks are in sync with code
        run: node scripts/context-sync.mjs --check

  branch-drift:
    name: Branch drift (which branch is real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history — behind/ahead vs origin/main needs it
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Always surface the full drift picture in the logs (informational; never fails).
      - name: Report branch drift vs main
        run: node scripts/branch-drift.mjs
      # Fails if THIS branch is egregiously behind main → you may be planning/merging off a stale base.
      - name: Fail if the branch is far behind main
        run: node scripts/branch-drift.mjs --check

  js-tests:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm test

  forge-tests:
    name: Foundry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge tests
        run: forge test -vv

  rust-tests:
    name: Rust (YPN off-chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ubuntu-latest's preinstalled Rust (currently 1.94) ships WITHOUT the clippy component, so
      # `cargo clippy` fails with "'cargo-clippy' is not installed for the toolchain '1.94'".
      # dtolnay/rust-toolchain@stable did NOT reliably add clippy to that pre-existing toolchain
      # (the install step passed but `cargo clippy` still couldn't find it), so add the component
      # explicitly to the active default toolchain — this always resolves for a stable release.
      - name: Add clippy component
        run: rustup component add clippy

      # The edge-auth + relayer crates are detached workspaces, so test each in its own dir.
      # Live-network tests (EDGE_RPC_URL / RELAYER_RPC_URL) self-skip when the env is unset.
      - name: edge-auth — test + clippy
        working-directory: services/edge-auth
        run: |
          cargo test --locked
          cargo clippy --all-targets -- -D warnings

      - name: relayer — test + clippy
        working-directory: services/relayer
        run: |
          cargo test --locked
          cargo clippy --all-targets -- -D warnings

  formal-proofs:
    name: Formal proofs (Halmos, advisory)
    runs-on: ubuntu-latest
    # Where the symbolic proofs actually EXECUTE. The repo's macOS-13-arm64 dev box can't install a
    # recent Halmos (its yices-solver wheel targets macOS 14+, so uv falls back to 0.2.6, which crashes
    # with an internal IndexError before solving). Linux has the manylinux yices wheels, so `pipx install
    # halmos` gets a current build and the 7 MWFormalProofs specs run here. Advisory (continue-on-error)
    # until a green run is observed and promoted to a hard gate — see docs/developers/ulv-formal-verification.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # forge lib deps (v4-core/periphery, forge-std)

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Halmos
        run: pipx install halmos

      - name: Build with AST (Halmos reads the source AST)
        run: forge build --ast

      - name: Halmos — symbolic proofs (MWFormalProofs, all 7 check_*)
        run: halmos --root . --forge-build-out contracts-v4/out --contract MWFormalProofs

  security-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Advisory for now (continue-on-error) so a pre-existing transitive advisory doesn't
      # block every merge. Remove `continue-on-error` to make high/critical a hard gate.
      - name: pnpm audit (high+, prod deps)
        continue-on-error: true
        run: pnpm audit --audit-level=high --prod
