name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context-drift:
    name: Context drift (AUTO blocks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install needed — the generator uses only Node builtins.
      - name: Check .claude AUTO blocks are in sync with code
        run: node scripts/context-sync.mjs --check

  js-tests:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm test

  forge-tests:
    name: Foundry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge tests
        run: forge test -vv

  rust-tests:
    name: Rust (YPN off-chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships a stable Rust toolchain + cc (mlua vendored builds Lua from source).
      # The edge-auth + relayer crates are detached workspaces, so test each in its own dir.
      # Live-network tests (EDGE_RPC_URL / RELAYER_RPC_URL) self-skip when the env is unset.
      - name: edge-auth — test + clippy
        working-directory: services/edge-auth
        run: |
          cargo test --locked
          cargo clippy --all-targets -- -D warnings

      - name: relayer — test + clippy
        working-directory: services/relayer
        run: |
          cargo test --locked
          cargo clippy --all-targets -- -D warnings
