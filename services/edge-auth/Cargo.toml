# Standalone workspace: detached from the repo-root Cargo.toml (whose `programs/*` Anchor members
# were removed), so this crate builds independently with plain `cargo` and its own lockfile.
[workspace]

[package]
name = "edge-auth"
version = "0.1.0"
edition = "2021"
description = "YPN edge-auth engine — sub-150ms card authorization off a cached vault NAV. Increments 1-2: the decision core + an axum server over an in-memory hold store."

[lib]
path = "src/lib.rs"

[[bin]]
name = "edge-auth-server"
path = "src/main.rs"

[dependencies]
# The decision core (nav/ledger/store) stays dependency-free; the server layer adds only the essentials.
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Chain reader (increment 4): ABI encode/decode via alloy-sol-types; plain JSON-RPC over reqwest
# (rustls, no OpenSSL) — the light path, no full provider stack.
alloy-sol-types = "0.8"
alloy-primitives = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# EDGE_SIGNER (increment 5): secp256k1 EIP-712 signing over the ShortLivedHoldAuth the Gateway checks.
# k256 for recoverable ECDSA; keccak/eip712 come from alloy-primitives / alloy-sol-types above.
k256 = { version = "0.13", features = ["ecdsa"] }

[dev-dependencies]
# Exercise the axum router in-process (no socket) for the server wiring tests.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Prove the Redis atomic-reserve Lua script with an EMBEDDED Lua interpreter + a mock Redis, so the
# race-safety logic is verified without a Redis server (which we don't have here).
mlua = { version = "0.9", features = ["lua54", "vendored"] }

[lints.rust]
unsafe_code = "forbid"
