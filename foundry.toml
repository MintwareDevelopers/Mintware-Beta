[profile.default]
src            = "contracts-v4/src"
test           = "contracts-v4/test"
script         = "contracts-v4/script"
out            = "contracts-v4/out"
libs           = ["contracts-v4/lib"]
solc           = "0.8.26"
optimizer      = true
optimizer_runs = 200
via_ir         = true

# Foundry remappings — V4 core + periphery + OZ
remappings = [
  "@uniswap/v4-core/=contracts-v4/lib/v4-core/",
  "@uniswap/v4-periphery/=contracts-v4/lib/v4-periphery/",
  "@openzeppelin/contracts/=contracts-v4/lib/openzeppelin-contracts/contracts/",
  "@pyth-network/pyth-sdk-solidity/=contracts-v4/lib/pyth-sdk-solidity/",
  "forge-std/=contracts-v4/lib/forge-std/src/",
]

# Anvil fork for integration tests (Base mainnet)
[profile.default.rpc_endpoints]
base          = "${BASE_RPC_URL}"
base_sepolia  = "${BASE_SEPOLIA_RPC_URL}"
arc           = "https://rpc.testnet.arc.io"  # public Arc testnet RPC (Circle) — chain 5042002, USDC gas

[profile.default.etherscan]
base = { key = "${BASESCAN_API_KEY}", chain = 8453, url = "https://api.basescan.org/api" }
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }

# Test profile — faster, no optimizer
[profile.test]
optimizer      = false
via_ir         = false

[fmt]
line_length    = 100
tab_width      = 4
bracket_spacing = true
