[profile.default]
src            = "contracts-v4/src"
test           = "contracts-v4/test"
script         = "contracts-v4/script"
out            = "contracts-v4/out"
libs           = ["contracts-v4/lib"]
solc           = "0.8.26"
optimizer      = true
optimizer_runs = 200
via_ir         = true

# Foundry remappings — V4 core + periphery + OZ
remappings = [
  "@uniswap/v4-core/=contracts-v4/lib/v4-core/",
  "@uniswap/v4-periphery/=contracts-v4/lib/v4-periphery/",
  "@openzeppelin/contracts/=contracts-v4/lib/openzeppelin-contracts/contracts/",
  "@pyth-network/pyth-sdk-solidity/=contracts-v4/lib/pyth-sdk-solidity/",
  "forge-std/=contracts-v4/lib/forge-std/src/",
]

# Anvil fork for integration tests (Base mainnet)
[profile.default.rpc_endpoints]
base          = "${BASE_RPC_URL}"
base_sepolia  = "${BASE_SEPOLIA_RPC_URL}"
arc           = "https://rpc.testnet.arc.io"  # public Arc testnet RPC (Circle) — chain 5042002, USDC gas

[profile.default.etherscan]
base = { key = "${BASESCAN_API_KEY}", chain = 8453, url = "https://api.basescan.org/api" }
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }

# Invariant + fuzz budget — PINNED so the documented depth is reproducible from config alone (not
# reliant on Foundry's shifting defaults). 256 runs × 500 depth = 128,000 total calls per invariant,
# matching every suite's natspec ("256 runs × 128,000 calls, 0 reverts"). fail_on_revert stays false:
# handlers are bounded and solvency is asserted via the invariants + afterInvariant non-vacuity guards.
[profile.default.invariant]
runs           = 256
depth          = 500
fail_on_revert = false

[profile.default.fuzz]
runs = 256

# Deep profile for CI / pre-audit sign-off: `FOUNDRY_PROFILE=deep forge test`. Inherits everything from
# default (src/solc/remappings) and only widens the search. Slower — not the default so local runs stay fast.
[profile.deep.invariant]
runs           = 512
depth          = 1000
fail_on_revert = false

[profile.deep.fuzz]
runs = 1024

# Test profile — faster, no optimizer
[profile.test]
optimizer      = false
via_ir         = false

# Halmos profile — Halmos re-runs `forge build` itself before every symbolic-execution pass, and a
# plain build strips the full AST that Halmos needs to resolve some expressions. Inherits everything
# from default; only adds ast output. Run with `FOUNDRY_PROFILE=halmos halmos ...`.
#
# ⚠ KNOWN UNRESOLVED (2026-09-09): even with ast=true and a clean build-info directory, halmos 0.2.6
# fails EVERY check_* in LpGatewayFormalProofs.t.sol with `IndexError: pop from empty list` (not a real
# counterexample — an internal halmos error, seen alongside `WARNING Skipped VmContractHelperN.json due
# to parsing failure: KeyError: 'ast'` for many forge-std internals). Tried: (1) plain rebuild, (2) this
# dedicated profile forcing ast=true, (3) removing a stale partial build-info file left by an earlier
# non-ast build, (4) disabling via_ir/optimizer for this profile — REVERTED, that broke the whole build
# instead (contracts-v4/src/payments/lib/MWTreasuryPositionLib.sol genuinely needs via_ir, "stack too
# deep" otherwise; via_ir cannot be off project-wide). Root cause not found — likely a halmos/via-IR AST
# incompatibility at this codebase's size, not a cache/staleness issue. Formal proof considered BLOCKED
# on this host for now; the same properties (F1, R3-INV-3, invariant-15) are still exercised — as fuzz
# SAMPLES rather than exhaustive proofs — by the passing Foundry test suite. Revisit in CI/Linux or a
# newer halmos release rather than re-attempting the same workarounds.
[profile.halmos]
ast = true

[fmt]
line_length    = 100
tab_width      = 4
bracket_spacing = true
