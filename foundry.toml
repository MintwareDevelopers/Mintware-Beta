[profile.default]
src            = "contracts-v4/src"
test           = "contracts-v4/test"
script         = "contracts-v4/script"
out            = "contracts-v4/out"
libs           = ["contracts-v4/lib"]
solc           = "0.8.26"
optimizer      = true
optimizer_runs = 200
via_ir         = true
# Code hashes are pinned (engine ↔ lifecycle module), so keep metadata out of bytecode:
# otherwise remappings auto-detected from whatever submodules are checked out change the hash.
bytecode_hash  = "none"
cbor_metadata  = false
fs_permissions = [{ access = "read", path = "./contracts-v4/script/data" }, { access = "read", path = "./contracts-v4/out" }]

# Foundry remappings — V4 core + periphery + OZ
remappings = [
  "contracts-v4/lib/v4-periphery-permissioned/:permit2/=contracts-v4/lib/v4-periphery-permissioned/lib/permit2/",
  "contracts-v4/lib/universal-router/:@uniswap/v4-periphery/=contracts-v4/lib/v4-periphery-permissioned/",
  "@uniswap/v2-core/=contracts-v4/lib/v4-hooks-public/lib/v2-core/",
  "@uniswap/v3-core/=contracts-v4/lib/v4-hooks-public/lib/v3-core/",
  "@uniswap/v3-periphery/=contracts-v4/lib/universal-router/lib/v3-periphery/",
  "contracts-v4/lib/universal-router/:permit2/=contracts-v4/lib/universal-router/lib/permit2/",
  "contracts-v4/lib/universal-router/:solmate/=contracts-v4/lib/universal-router/lib/solmate/",
  "@uniswap/v4-periphery-permissioned/=contracts-v4/lib/v4-periphery-permissioned/",
  "@uniswap/v4-hooks-public/=contracts-v4/lib/v4-hooks-public/",
  "contracts-v4/lib/v4-hooks-public/:@uniswap/v4-periphery/=contracts-v4/lib/v4-periphery-permissioned/",
  "@uniswap/v4-core/=contracts-v4/lib/v4-core/",
  "@uniswap/v4-periphery/=contracts-v4/lib/v4-periphery/",
  "@openzeppelin/contracts/=contracts-v4/lib/openzeppelin-contracts/contracts/",
  "@pyth-network/pyth-sdk-solidity/=contracts-v4/lib/pyth-sdk-solidity/",
  "forge-std/=contracts-v4/lib/forge-std/src/",
]

# Anvil fork for integration tests (Base mainnet)
[profile.default.rpc_endpoints]
base          = "${BASE_RPC_URL}"
base_sepolia  = "${BASE_SEPOLIA_RPC_URL}"

[profile.default.etherscan]
base = { key = "${BASESCAN_API_KEY}", chain = 8453, url = "https://api.basescan.org/api" }
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }

# Invariant + fuzz budget — PINNED so the documented depth is reproducible from config alone (not
# reliant on Foundry's shifting defaults). 256 runs × 500 depth = 128,000 total calls per invariant,
# matching every suite's natspec ("256 runs × 128,000 calls, 0 reverts"). fail_on_revert stays false:
# handlers are bounded and solvency is asserted via the invariants + afterInvariant non-vacuity guards.
[profile.default.invariant]
runs           = 256
depth          = 500
fail_on_revert = false

[profile.default.fuzz]
runs = 256

# Deep profile for CI / pre-audit sign-off: `FOUNDRY_PROFILE=deep forge test`. Inherits everything from
# default (src/solc/remappings) and only widens the search. Slower — not the default so local runs stay fast.
[profile.deep.invariant]
runs           = 512
depth          = 1000
fail_on_revert = false

[profile.deep.fuzz]
runs = 1024

# Test profile — faster, no optimizer
[profile.test]
optimizer      = false
via_ir         = false

[fmt]
line_length    = 100
tab_width      = 4
bracket_spacing = true

# Actual Universal Router + pinned Permit2 runtime proof. Requires the two pinned core imports.
[profile.permissioned_router]
test = "contracts-v4/integration"
