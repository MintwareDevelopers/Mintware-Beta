specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: AIAttribution
    network: base
    source:
      address: "0xb9FB965Caa7197932b52631e0121Ea54586e2B88"
      abi: AIAttribution
      startBlock: 43834700
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Agent
        - Campaign
        - ActionRecord
        - MwpSubmission
        - RiskEvent
      abis:
        - name: AIAttribution
          file: AIAttribution/AIAttribution.json
      eventHandlers:
        - event: AgentRegistered(indexed address,indexed uint256)
          handler: handleAgentRegistered
        - event: Erc8004Linked(indexed address,indexed uint256)
          handler: handleErc8004Linked
        - event: ActionRecorded(indexed address,indexed uint256,uint256,bytes32,uint256)
          handler: handleActionRecorded
        - event: MwpHashSubmitted(indexed address,indexed bytes32,uint256)
          handler: handleMwpHashSubmitted
        - event: RiskPenaltyApplied(indexed address,uint64,string)
          handler: handleRiskPenaltyApplied
        - event: CampaignCreated(indexed uint256,indexed address,string)
          handler: handleCampaignCreated
      file: AIAttribution/AIAttribution.wasm
